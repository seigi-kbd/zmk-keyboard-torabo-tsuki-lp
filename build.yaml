  # --- トラックボールのデバッグ用（USBログ有効） ---
  # studio-rpc-usb-uart を外してあるのは、ZMK Studio の RPC と USB ログが同じ CDC ACM を
  # 取り合うため。このビルドでは Studio は使えない代わりに、COMポートへログが流れる。
  - board: bmp_boost
    shield: torabo_tsuki_lp_right
    snippet: "split-central input-trackball input-listener"
    cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
    artifact-name: torabo_tsuki_lp_right_central_debug
  - board: bmp_boost
    shield: settings_reset